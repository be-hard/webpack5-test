name: CI

on:
  push:
    branches:
      - main
      - "release/**"
      - "feature/**"
  pull_request:
    branches:
      - main
      - "release/**"
      - "feature/**"

# Cancel older runs for the same branch/PR when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Map branch names to API environment values.
      # feature/* branches use the test API and send the branch suffix as feature-tag.
      - name: Resolve API environment
        shell: bash
        run: |
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"

          if [[ "$BRANCH_NAME" == feature/* ]]; then
            FEATURE_TAG="${BRANCH_NAME#feature/}"
            {
              echo "APP_MODE=test"
              echo "APP_FEATURE_TAG=$FEATURE_TAG"
              echo "BUILD_MODE=development"
              echo "GENERATE_API_SCRIPT=api:generate:test"
            } >> "$GITHUB_ENV"
          elif [[ "$BRANCH_NAME" == release/* || "$BRANCH_NAME" == "main" ]]; then
            {
              echo "APP_MODE=production"
              echo "APP_FEATURE_TAG="
              echo "BUILD_MODE=production"
              echo "GENERATE_API_SCRIPT=api:generate:production"
            } >> "$GITHUB_ENV"
          else
            {
              echo "APP_MODE=development"
              echo "APP_FEATURE_TAG="
              echo "BUILD_MODE=development"
              echo "GENERATE_API_SCRIPT=api:generate"
            } >> "$GITHUB_ENV"
          fi

          echo "Resolved branch: $BRANCH_NAME"

      # This project uses a lockfile generated by pnpm v10.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      # Node 20 is required by the current ESLint/TypeScript toolchain.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: pnpm

      # HUSKY=0 prevents the prepare script from installing git hooks in CI.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      # Pull OpenAPI from the environment resolved above.
      # For feature/* branches, APP_FEATURE_TAG is sent as the feature-tag header.
      - name: Generate API types
        run: pnpm run $GENERATE_API_SCRIPT

      # Keep formatting, linting, types, and production build as separate steps
      # so CI failures point to the exact layer that needs attention.
      - name: Check formatting
        run: pnpm run format

      - name: Lint source
        run: pnpm run lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build bundle
        run: pnpm exec webpack --config config/webpack/webpack.${BUILD_MODE}.js --mode $BUILD_MODE
